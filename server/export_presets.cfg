; PRD 87, 99, 100 - Linux headless dedicated server export preseti.
; infrastructure/docker/Dockerfile.gameserver bu presetin adindan asilidir.

[preset.0]

name="Linux Server"
platform="Linux"
runnable=true
dedicated_server=true
custom_features=""
export_filter="all_resources"
include_filter="*.json"
exclude_filter="*.png, *.jpg, *.ogg, *.wav"
export_path="../build/linux-server/NaxcivanCS.Server"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=false
texture_format/etc2_astc=false
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false
dotnet/embed_build_outputs=true
