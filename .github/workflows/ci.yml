# PRD 122, 123 - CI kecmelidir; solo development-de mandatory approval teleb olunmaya biler.
name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'release/**', 'codex/**']
  pull_request:
    branches: [main, develop]

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  documentation:
    name: Documentation links and Wiki export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Markdown links
        shell: pwsh
        run: ./tools/check-doc-links.ps1
      # SourceRef Wiki-dəki permalink-ləri qurur. Teqə bərkidilsə, növbəti
      # buraxılışdan sonra linklər köhnə koda işarə edər — ona görə cari commit.
      - name: Export Wiki without publishing
        shell: pwsh
        run: ./tools/publish-wiki.ps1 -SourceRef ${{ github.sha }}

  # PRD 123 - Backend: restore, build, test
  backend-and-shared:
    name: Shared + Backend (build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore NaxcivanCS.sln

      - name: Build
        run: dotnet build NaxcivanCS.sln --configuration Release --no-restore

      - name: Format check (PRD 154)
        run: dotnet format NaxcivanCS.sln --verify-no-changes --no-restore
        continue-on-error: true

      - name: Test (PRD 124 - economy, damage, weapon stats, match state)
        run: dotnet test NaxcivanCS.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/*.trx'

  # PRD 123 - Client/Server: build
  godot-projects:
    name: Godot client + server (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build dedicated server assembly
        run: dotnet build server/NaxcivanCS.Server.csproj --configuration Release

      - name: Build client assembly
        run: dotnet build client/NaxcivanCS.Client.csproj --configuration Release

  # PRD 137 - End-to-end: dedicated server + 2 client, handshake və snapshot axını
  e2e-smoke-test:
    name: E2E smoke test (server + 2 client)
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-mono-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot (mono, headless)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-extract
          mv /tmp/godot-extract/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/* ~/godot/
          chmod +x ~/godot/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64

      - name: Build client and server assemblies
        run: |
          dotnet build server/NaxcivanCS.Server.csproj --configuration Debug
          dotnet build client/NaxcivanCS.Client.csproj --configuration Debug

      - name: Run end-to-end smoke test
        run: |
          export GODOT_BIN=~/godot/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64
          bash tools/e2e-smoke-test.sh

  # PRD 123 - Server: docker + security scan
  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend-and-shared]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -f infrastructure/docker/backend.dockerfile -t naxcivancs-backend:${{ github.sha }} .

  # PRD 111, 123 - Security scan
  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Vulnerable package scan
        run: |
          dotnet restore NaxcivanCS.sln
          dotnet list NaxcivanCS.sln package --vulnerable --include-transitive 2>&1 | tee audit.log
          ! grep -q "has the following vulnerable packages" audit.log
