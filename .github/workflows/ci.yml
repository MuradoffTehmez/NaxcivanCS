# PRD 122, 123 - CI kecmelidir; solo development-de mandatory approval teleb olunmaya biler.
name: CI

on:
  workflow_call:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'release/**', 'codex/**']
  pull_request:
    branches: [main, develop]

# PRD 111 - CodeQL (actions/missing-workflow-permissions) bunu tapdi:
# acik permissions olmadiqda GITHUB_TOKEN genis yazma icazesi alir.
# Ele bir job yoxdur ki, repoya yazsin, ona gore hamisi yalniz oxuyur.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  documentation:
    name: Documentation links and Wiki export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check version synchronization
        shell: pwsh
        run: ./tools/sync-version.ps1 -Check
      - name: Check workflow helper regressions
        shell: pwsh
        run: ./tools/test-quality-gates.ps1
      - name: Check Markdown links
        shell: pwsh
        run: ./tools/check-doc-links.ps1
      # SourceRef Wiki-dəki permalink-ləri qurur. Teqə bərkidilsə, növbəti
      # buraxılışdan sonra linklər köhnə koda işarə edər — ona görə cari commit.
      - name: Export Wiki without publishing
        shell: pwsh
        run: ./tools/publish-wiki.ps1 -SourceRef ${{ github.sha }}

  # PRD 123 - Backend: restore, build, test
  backend-and-shared:
    name: Shared + Backend (build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # This job is already required on main/develop: DCO cannot be bypassed
      # just because a new standalone check has not been added to protection yet.
      - name: Enforce PR commit DCO
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./tools/check-dco.ps1 -BaseSha $env:BASE_SHA -HeadSha $env:HEAD_SHA

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore NaxcivanCS.sln

      - name: Build
        run: dotnet build NaxcivanCS.sln --configuration Release --no-restore

      - name: Format check (PRD 154)
        run: dotnet format NaxcivanCS.sln --verify-no-changes --no-restore

      - name: Test (PRD 124 - economy, damage, weapon stats, match state)
        run: dotnet test NaxcivanCS.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --settings coverage.runsettings --results-directory TestResults --logger trx

      - name: Enforce coverage (70% per tested layer)
        shell: pwsh
        run: ./tools/check-coverage.ps1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: error

  # PRD 123 - Client/Server: build
  godot-projects:
    name: Godot client + server (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build dedicated server assembly
        run: dotnet build server/NaxcivanCS.Server.csproj --configuration Release

      - name: Build client assembly
        run: dotnet build client/NaxcivanCS.Client.csproj --configuration Release

      - name: Verify Godot project formatting
        run: |
          dotnet format server/NaxcivanCS.Server.csproj --verify-no-changes --no-restore
          dotnet format client/NaxcivanCS.Client.csproj --verify-no-changes --no-restore

  # PRD 137 - End-to-end: dedicated server + 2 client, handshake və snapshot axını
  e2e-smoke-test:
    name: E2E smoke test (server + 2 client)
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: ~/godot
          key: godot-mono-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot (mono, headless)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot-extract
          mv /tmp/godot-extract/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/* ~/godot/
          chmod +x ~/godot/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64

      - name: Build client and server assemblies
        run: |
          dotnet build server/NaxcivanCS.Server.csproj --configuration Debug
          dotnet build client/NaxcivanCS.Client.csproj --configuration Debug

      - name: Run end-to-end smoke test
        run: |
          export GODOT_BIN=~/godot/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64
          bash tools/e2e-smoke-test.sh

  # PRD 123 - Server: docker + security scan
  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend-and-shared]
    if: github.event_name == 'release' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')))
    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -f infrastructure/docker/backend.dockerfile -t naxcivancs-backend:${{ github.sha }} .
